services:
  app:
    init: true
    build: .
    ports:
      - "${PORT:-3001}:3001"
    environment:
      - PORT=3001
      - DB_PATH=/data/seedtrace.db
      - STATIC_DIR=/app/dist
      - NODE_ENV=production
    volumes:
      - seedtrace-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3001/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  seedtrace-data:
